<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Food Supply Management System — Track suppliers, products, inventory, orders and more.">
  <title>{% block title %}Food Supply Management System{% endblock %}</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Design System -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">

  {% block head_extra %}{% endblock %}
</head>
<body>

{% block body %}{% endblock %}

<!-- Toast Container -->
<div id="toast-container" class="fixed top-5 right-5 z-[999] flex flex-col gap-3 pointer-events-none" style="position:fixed;top:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:10px;pointer-events:none;"></div>

<script>
// ─── Global state ───────────────────────────────────────
window.CAN_WRITE = {{ 'true' if can_write else 'false' }};
window.IS_ADMIN  = {{ 'true' if is_admin else 'false' }};
window.CURRENT_USER = {
  username: "{{ current_user.username }}",
  role:     "{{ current_user.role }}"
};

// ─── Toast system ────────────────────────────────────────
function showToast(message, type = 'success', duration = 3500) {
  const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', info: 'fa-circle-info' };
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.style.pointerEvents = 'auto';
  toast.innerHTML = `
    <i class="fas ${icons[type] || icons.info} toast-icon"></i>
    <span style="flex:1">${message}</span>
    <button onclick="this.parentElement.remove()" style="background:none;border:none;cursor:pointer;color:inherit;font-size:16px;padding:0;margin-left:8px;opacity:.6">&times;</button>
  `;
  container.appendChild(toast);
  setTimeout(() => toast.style.opacity = '0', duration);
  setTimeout(() => toast.remove(), duration + 400);
}

// ─── User dropdown ───────────────────────────────────────
function toggleUserDropdown(e) {
  e.stopPropagation();
  const dd = document.getElementById('user-dropdown');
  if (!dd) return;
  dd.classList.toggle('hidden');
}
document.addEventListener('click', () => {
  const dd = document.getElementById('user-dropdown');
  if (dd) dd.classList.add('hidden');
});

// ─── Generic API helpers ──────────────────────────────────
async function apiGet(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function apiPost(url, body) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  return res.json();
}

async function apiPut(url, body) {
  const res = await fetch(url, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  return res.json();
}

async function apiDelete(url) {
  const res = await fetch(url, { method: 'DELETE' });
  return res.json();
}
</script>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
